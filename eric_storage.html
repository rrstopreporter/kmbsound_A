<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
  window.addEventListener('message', function(event) {
    let data = event.data;
    if (data.action === 'save') {
       localStorage.setItem(data.key, data.value);
    } else if (data.action === 'loadAll') {
       let x = localStorage.getItem('ericMemoryX') || "";
       let y = localStorage.getItem('ericMemoryY') || "";
       let code = localStorage.getItem('ericPlayingCode') || "";
       event.source.postMessage({ action: 'loadedAll', x: x, y: y, code: code }, event.origin);
    }
  });
</script>
</body>
</html>

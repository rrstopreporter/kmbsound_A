<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KMB Storage Bridge</title>
</head>
<body>
  <script>
    // ★ 魔法喺呢度：一載入完就主動同主網頁講「我 Ready 喇」
    window.onload = function() {
        window.parent.postMessage({ action: 'ready' }, '*');
    };

    window.addEventListener('message', function(event) {
      const data = event.data;
      if (!data || !data.action) return;

      if (data.action === 'save') {
        localStorage.setItem('kmb_sim_route', data.route || '');
        localStorage.setItem('kmb_sim_bound', data.bound || '');
        localStorage.setItem('kmb_sim_type', data.type || '');
        localStorage.setItem('kmb_sim_index', data.index || 0);
      }
      else if (data.action === 'load') {
        event.source.postMessage({
          action: 'loaded',
          route: localStorage.getItem('kmb_sim_route'),
          bound: localStorage.getItem('kmb_sim_bound'),
          type: localStorage.getItem('kmb_sim_type'),
          index: localStorage.getItem('kmb_sim_index')
        }, event.origin);
      }
      else if (data.action === 'clear') {
        localStorage.removeItem('kmb_sim_route');
        localStorage.removeItem('kmb_sim_bound');
        localStorage.removeItem('kmb_sim_type');
        localStorage.removeItem('kmb_sim_index');
      }
    });
  </script>
</body>
</html>
